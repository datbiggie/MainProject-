{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="{% static 'index/style.css' %}">
</head>
<body>

{% include 'ecommerce_app/barra_superior_index.html' %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fas fa-user-edit me-2"></i>Editar Perfil</h4>
                </div>
                <div class="card-body">
                    {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}

                        <!-- Nombre de Usuario -->
                        <div class="mb-3">
                            <label for="nombre_usuario" class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" id="nombre_usuario" name="nombre_usuario" value="{{ usuario.nombre_usuario }}">
                        </div>

                        <!-- Teléfono -->
                        <div class="mb-3">
                            <label for="telefono_usuario" class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" id="telefono_usuario" name="telefono_usuario" value="{{ usuario.telefono_usuario|default:'' }}">
                        </div>

                        <!-- Fecha de Nacimiento -->
                        <div class="mb-3">
                            <label for="fecha_nacimiento" class="form-label">Fecha de Nacimiento</label>
                            <input type="date" class="form-control" id="fecha_nacimiento" name="fecha_nacimiento" value="{{ usuario.fecha_nacimiento|date:'Y-m-d' }}">
                        </div>

                        <!-- País y Estado -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="pais" class="form-label">País</label>
                                <input type="text" class="form-control" id="pais" name="pais" value="{{ usuario.pais }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="estado" class="form-label">Estado</label>
                                <input type="text" class="form-control" id="estado" name="estado" value="{{ usuario.estado }}">
                            </div>
                        </div>

                        <!-- Foto de Perfil -->
                        <div class="mb-3">
                            <label for="foto_usuario" class="form-label">Foto de Perfil</label>
                            <input type="file" class="form-control" id="foto_usuario" name="foto_usuario" accept="image/*">
                            {% if usuario.foto_usuario %}
                                <small class="form-text text-muted">Actual: <a href="{{ usuario.foto_usuario.url }}" target="_blank">ver imagen</a></small>
                            {% endif %}
                        </div>

                        <!-- Avatar del Chatbot -->
                        <div class="mb-3">
                            <label for="avatar_chatbot" class="form-label">Avatar del Chatbot</label>
                            <input type="text" class="form-control" id="avatar_chatbot" name="avatar_chatbot" value="{{ usuario.avatar_chatbot }}">
                            <small class="form-text text-muted">Ruta al archivo del avatar. Ej: avatars/mi_avatar.jpg</small>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-end">
                            <a href="{% url 'perfil_usuario' %}" class="btn btn-secondary me-2">Cancelar</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
