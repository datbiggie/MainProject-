{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
	<title>Iniciar Sesión</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="{% static 'iniciar_sesion/images/icons/favicon.ico' %}"/>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
	<link rel="stylesheet" href="{% static 'iniciar_sesion/fonts/font-awesome-4.7.0/css/font-awesome.min.css' %}">
	<link rel="stylesheet" href="{% static 'iniciar_sesion/fonts/iconic/css/material-design-iconic-font.min.css' %}">
	<link rel="stylesheet" href="{% static 'iniciar_sesion/css/util.css' %}">
    <link rel="stylesheet" href="{% static 'iniciar_sesion/css/main.css' %}">
    <link rel="stylesheet" href="{% static 'barra_superior/css/main.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

	{% include 'ecommerce_app/barra_superior_bienvenido.html' %}

	<style>
	/* Optimización de la card de login - Diseño más compacto */
	.login-page {
		min-height: 100vh;
		display: flex;
		align-items: center;
		justify-content: center;
		padding: 120px 15px 20px 15px;
		background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
	}
	
	.login-container {
		background: white;
		border-radius: 12px;
		box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
		padding: 30px;
		width: 100%;
		max-width: 400px;
		margin: 0 auto;
	}
	
	/* Header más compacto */
	.login-header {
		text-align: center;
		margin-bottom: 20px;
	}
	
	.login-logo {
		display: block;
		margin: 0 auto 10px auto;
		width: 200px !important;
		height: 100px !important;
		object-fit: contain;
		border-radius: 8px;
	}
	
	.login-title {
		font-size: 24px;
		font-weight: 600;
		color: #333;
		margin: 0 0 5px 0;
		letter-spacing: -0.5px;
	}
	
	.login-subtitle {
		font-size: 14px;
		color: #666;
		margin: 0;
		font-weight: 400;
	}
	
	/* Campos de entrada optimizados */
	.input-container {
		margin-bottom: 20px;
	}
	
	.form-group {
		margin-bottom: 15px;
	}
	
	.form-label {
		display: flex;
		align-items: center;
		gap: 8px;
		font-size: 14px;
		font-weight: 500;
		color: #555;
		margin-bottom: 8px;
	}
	
	.form-label i {
		font-size: 16px;
		color: #007bff;
	}
	
	.form-input {
		width: 100%;
		padding: 12px 15px;
		border: 2px solid #e1e5e9;
		border-radius: 8px;
		font-size: 14px;
		transition: all 0.3s ease;
		background-color: #f8f9fa;
	}
	
	.form-input:focus {
		outline: none;
		border-color: #007bff;
		background-color: white;
		box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
	}
	
	/* Password toggle optimizado */
	.password-wrapper {
		position: relative;
	}
	
	.password-wrapper .form-input {
		padding-right: 44px;
	}
	
	.toggle-password {
		position: absolute;
		right: 8px;
		top: 50%;
		transform: translateY(-50%);
		border: none;
		background: transparent;
		cursor: pointer;
		color: #666;
		font-size: 18px;
		display: flex;
		align-items: center;
		justify-content: center;
		padding: 6px;
		border-radius: 4px;
		transition: all 0.2s ease;
	}
	
	.toggle-password:hover {
		background-color: rgba(0, 123, 255, 0.1);
		color: #007bff;
	}
	
	.toggle-password:focus {
		outline: none;
	}
	
	/* Enlace de recuperación optimizado */
	.forgot-password-always-visible {
		margin: 15px 0;
		text-align: center;
	}
	
	.forgot-password-link-permanent {
		color: #007bff;
		text-decoration: none;
		font-size: 13px;
		font-weight: 500;
		transition: all 0.3s ease;
		display: inline-flex;
		align-items: center;
		gap: 5px;
		padding: 6px 10px;
		border-radius: 6px;
		background-color: rgba(0, 123, 255, 0.08);
	}
	
	.forgot-password-link-permanent:hover {
		color: #0056b3;
		text-decoration: none;
		background-color: rgba(0, 123, 255, 0.15);
		transform: translateY(-1px);
	}
	
	.forgot-password-link-permanent i {
		font-size: 14px;
	}
	
	/* Botones optimizados */
	.button-container {
		display: flex;
		flex-direction: column;
		gap: 12px;
		margin-top: 20px;
	}
	
	.btn-primary {
		background: linear-gradient(135deg, #007bff, #0056b3);
		border: none;
		color: white;
		padding: 12px 20px;
		border-radius: 8px;
		font-size: 14px;
		font-weight: 600;
		cursor: pointer;
		transition: all 0.3s ease;
		text-transform: uppercase;
		letter-spacing: 0.5px;
	}
	
	.btn-primary:hover {
		transform: translateY(-2px);
		box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
	}
	
	.btn-secondary {
		background: transparent;
		border: 2px solid #e1e5e9;
		color: #666;
		padding: 10px 16px;
		border-radius: 8px;
		font-size: 14px;
		font-weight: 500;
		cursor: pointer;
		transition: all 0.3s ease;
	}
	
	.btn-secondary:hover {
		border-color: #007bff;
		color: #007bff;
		background-color: rgba(0, 123, 255, 0.05);
	}
	
	.btn-back {
		background: transparent;
		border: 2px solid #dc3545;
		color: #dc3545;
		padding: 10px 16px;
		border-radius: 8px;
		font-size: 14px;
		font-weight: 500;
		cursor: pointer;
		transition: all 0.3s ease;
		display: flex;
		align-items: center;
		justify-content: center;
		gap: 8px;
	}
	
	.btn-back:hover {
		background-color: #dc3545;
		color: white;
	}
	
	/* Dropdown mejorado */
	.dropdown-menu {
		border: none;
		box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
		border-radius: 8px;
		padding: 8px 0;
		margin-top: 8px;
	}
	
	.dropdown-item {
		padding: 10px 20px;
		font-size: 14px;
		display: flex;
		align-items: center;
		gap: 8px;
		transition: all 0.2s ease;
	}
	
	.dropdown-item:hover {
		background-color: rgba(0, 123, 255, 0.1);
		color: #007bff;
	}
	
	/* Animaciones suaves */
	.input-field {
		transition: all 0.3s ease;
	}
	
	.input-field.hidden {
		opacity: 0;
		transform: translateY(-10px);
	}
	
	.input-field.visible {
		opacity: 1;
		transform: translateY(0);
	}
	
	/* Responsive */
	@media (max-width: 480px) {
		.login-container {
			padding: 25px 20px;
			margin: 10px;
		}
		
		.login-logo {
			width: 160px !important;
			height: 80px !important;
		}
		
		.login-title {
			font-size: 22px;
		}
	}
	</style>
</head>
<body>
	<div class="login-page">
		<div class="login-container">
			<form method="POST" id="loginForm" class="login-form">
				{% csrf_token %}
				<div class="login-header">
					<img src="{% static 'iniciar_sesion/images/logo.jpg' %}" alt="Logo" class="login-logo">
					<h1 class="login-title">Bienvenido</h1>
					<p class="login-subtitle">Ingresa a tu cuenta</p>
				</div>
				<div class="input-container">
					<div class="input-field" id="emailField">
						<div class="form-group">
							<label for="email" class="form-label">
								<i class="zmdi zmdi-email"></i>
								Correo Electrónico
							</label>
							<input 
								class="form-input" 
								type="email" 
								name="email" 
								id="email" 
								placeholder="ejemplo@correo.com" 
								required>
						</div>
					</div>
					<div class="input-field hidden" id="passwordField">
						<div class="form-group">
							<label for="password" class="form-label">
								<i class="zmdi zmdi-lock"></i>
								Contraseña
							</label>
							<div class="password-wrapper">
								<input 
									class="form-input" 
									type="password" 
									name="password" 
									id="password" 
									placeholder="Ingresa tu contraseña" 
									required>
								<button type="button" id="togglePassword" class="toggle-password" aria-label="Mostrar contraseña">
									<i class="zmdi zmdi-eye"></i>
								</button>
							</div>
						</div>
					</div>
				</div>
				
				<!-- Enlace de recuperación siempre visible -->
				<div class="forgot-password-always-visible text-center mb-3">
					<a href="{% url 'recuperar_clave' %}" class="forgot-password-link-permanent">
						<i class="zmdi zmdi-help"></i>
						¿Olvidaste tu contraseña?
					</a>
				</div>
				
				<div class="button-container">
					<button type="button" class="btn-primary" id="nextButton">
						Siguiente
					</button>
					<div class="dropdown" id="createAccountDropdown">
						<button class="btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
							Crear cuenta
						</button>
						<ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
							<li><a class="dropdown-item" href="{% url 'registrar_persona' %}">
								<i class="zmdi zmdi-account"></i> Persona
							</a></li>
							<li><a class="dropdown-item" href="{% url 'registrar_empresa' %}">
								<i class="zmdi zmdi-city-alt"></i> Empresa
							</a></li>
						</ul>
					</div>
					<button type="button" class="btn-back" id="backButton" style="display: none;">
						<i class="zmdi zmdi-arrow-left"></i> Regresar
					</button>
				</div>
			</form>
		</div>
	</div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
	<script src="{% static 'iniciar_sesion/js/main.js' %}"></script>
</body>
</html>
