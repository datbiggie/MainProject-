{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'recuperacion/main.css' %}">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">


<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 recovery-card">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <div class="brand-circle mb-3">
                            <i class="fas fa-lock fa-2x text-white"></i>
                        </div>
                        <h3 class="mb-1">Recuperar contraseña</h3>
                        <p class="text-muted">Ingresa el correo asociado a tu cuenta y te enviaremos un código de recuperación.</p>
                    </div>

                    <form id="recoverForm" class="needs-validation" novalidate>
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="nombre@ejemplo.com" required>
                            <div class="invalid-feedback">Por favor ingresa un correo válido.</div>
                        </div>

                        <div class="d-grid">
                            <button id="btnSendCode" type="submit" class="btn btn-primary btn-lg">Enviar código</button>
                        </div>
                    </form>

                    <hr class="my-4">
                    <p class="text-center text-muted small">Revisa tu bandeja de entrada (y la carpeta de spam). El enlace expira en 1 hora.</p>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="{% static 'recuperacion/main.js' %}"></script>
</body>
</html>
